name: iwardrobe-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iwardrobe
      POSTGRES_USER: iwardrobe
      POSTGRES_PASSWORD: local-development
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iwardrobe -d iwardrobe"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis:/data"]
volumes:
  postgres:
  redis:
